# Build and deploy to an ECR
name: ECR

on:
  workflow_call:
    inputs:
      # --- AWS / ECR ---
      AWS_REGION:
        description: "Región de AWS"
        required: true
        type: string
      ECR_REPOSITORY:
        description: "Nombre del repositorio ECR"
        required: true
        type: string

      # --- Build ---
      dockerfile:
        description: "Nombre del Dockerfile a usar para el build"
        default: "Dockerfile"
        required: false
        type: string
      context:
        description: "Contexto de build de Docker (ruta relativa)"
        default: "."
        required: false
        type: string
      tag:
        description: "Tag de la imagen Docker en ECR"
        default: "latest"
        required: false
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        description: "AWS Access Key ID con permisos sobre ECR"
        required: true
      AWS_SECRET_ACCESS_KEY:
        description: "AWS Secret Access Key"
        required: true

env:
  ECR_REPOSITORY: ${{ inputs.ECR_REPOSITORY }}
  AWS_REGION: ${{ inputs.AWS_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Construir y subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            echo "❌ Error: ECR_REGISTRY está vacío. Verifica el paso de login."
            exit 1
          fi
          echo "✅ Registro ECR: $ECR_REGISTRY"
          echo "📦 Repositorio: $ECR_REPOSITORY"
          echo "🏷️  Tag: ${{ inputs.tag }}"
          echo "🐳 Dockerfile: ${{ inputs.dockerfile }}"

          docker buildx build \
            --cache-from type=registry,ref=$ECR_REGISTRY/$ECR_REPOSITORY:cache \
            --cache-to type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=$ECR_REGISTRY/$ECR_REPOSITORY:cache \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ inputs.tag }} \
            -f ${{ inputs.dockerfile }} \
            --push ${{ inputs.context }}
